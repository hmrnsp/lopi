[package]
name = "lopi-ssh"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "Open SSH connections from saved profiles with one short command, in any shell on Windows, macOS and Linux"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hmrnsp/lopi"
homepage = "https://github.com/hmrnsp/lopi"
readme = "README.md"
keywords = ["ssh", "cli", "launcher", "profiles", "terminal"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**/*", "tests/**/*", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE-*"]

[lib]
name = "lopi"

[[bin]]
name = "lopi"
path = "src/main.rs"

[dependencies]
age = { version = "0.12.1", default-features = false }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
fastrand = "2.5.0"
inquire = "0.9.4"
keyring = "4.2.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
rpassword = "7.5.4"
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
strsim = "0.11.1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
toml = "1.1.6"
toml_edit = "0.25.15"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zeroize = "1.9.0"

# Release archives: .tar.xz everywhere but Windows, .zip on Windows.
[target."cfg(not(windows))".dependencies]
lzma-rs = "0.3.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
assert_cmd = "2.2.2"
# Both archive formats are tested on every system.
lzma-rs = "0.3.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
